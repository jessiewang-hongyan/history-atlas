name: Deploy history atlas to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'tests/**'
      - 'scripts/build_lives.py'
      - 'research/people/initial-review.json'
      - 'research/people/map-review.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check dist/app.js
          node --check dist/data.js
          node --check dist/sushi.js
          node --check dist/history.js
          node --check dist/map-detail.js
          node tests/history.test.cjs
          node --check dist/lives-data.js
          node --check dist/lives-ui.js
          python3 scripts/build_lives.py --check
          node tests/lives.test.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
